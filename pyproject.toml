[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-governance-kit"
version = "0.1.0"
description = "A reference policy gate and evidence workbench for agentic AI governance"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agent-governance = "agent_governance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

