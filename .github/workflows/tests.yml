name: Reference validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-10-09
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test security boundaries
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Generate fixture evidence
        env:
          PYTHONPATH: src
        run: python -m agent_governance demo --policy examples/policy.json --output reports/local
