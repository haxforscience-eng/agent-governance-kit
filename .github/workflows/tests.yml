name: Reference validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-09
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test security boundaries
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Generate fixture evidence
        env:
          PYTHONPATH: src
        run: python -m agent_governance demo --policy examples/policy.json --output reports/local
